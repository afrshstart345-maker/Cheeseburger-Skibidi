<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple YouTube Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .video-container {
            margin: 20px auto;
            max-width: 560px;
        }
        iframe {
            border: none;
            width: 100%;
            height: 315px;
        }
        .controls {
            margin: 20px;
        }
        input {
            padding: 8px;
            font-size: 14px;
            width: 250px;
        }
        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Simple YouTube Player</h1>
    


    <div class="video-container">
        <iframe 
            id="youtubeIframe"
            src="https://www.youtube.com/embed/4ezcK1ZAJPU"
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>

    </div>
